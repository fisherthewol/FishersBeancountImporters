[project]
name = "beancountimporters"
version = "0.0.8"
description = "A bunch of importers for beancount/fava."
readme = "README.md"
authors = [
    { name = "George Kokinis", email = "george.kokinis@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "beancount==3.1.0",
    "beangulp==0.2.0",
    "coverage==7.9.1",
    "fava==1.30.3",
    "ofxtools>=0.9.5",
    "pypdf==5.6.1",
    "quiffen",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.uv.sources]
quiffen = { path = "../quiffen" }

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]
